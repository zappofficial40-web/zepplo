<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEPPLO - Coming Soon</title>
<style>
body{margin:0;font-family:Arial;background:#0f0f1a;color:white;text-align:center;padding:20px}
.logo{font-size:50px;font-weight:bold;margin-top:30px}
.logo span{color:#a855f7}
.tag{color:#ccc;margin:10px 0 30px}
.card{background:#1a1a2e;padding:25px;border-radius:20px;max-width:400px;margin:20px auto}
input{width:90%;padding:12px;border-radius:10px;border:none;margin:10px 0}
.btn{width:95%;padding:13px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;margin:8px 0;font-size:16px}
.purple{background:#a855f7;color:white}
.green{background:#25D366;color:white}
.dark{background:#2a2a3a;color:white}
.features{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:20px}
.feat{background:#1a1a2e;padding:12px;border-radius:12px;width:100px}
</style>
</head>
<body>
<div class="logo">Z<span>EP</span>PLO</div>
<p class="tag">The Future of Chatting. Fast. Fun. Free.</p>
<div class="card">
<h2>Coming Soon</h2>
<p>We are building something amazing.<br>Be the first to know when we launch.</p>
<input type="email" id="email" placeholder="Enter your email address">
<button class="btn purple" onclick="notify()">Get Notified →</button>
<button class="btn green" onclick="shareSite()">Share ZEPPLO on WhatsApp</button>
<button class="btn dark" onclick="copyLink()">Copy Link</button>
<p id="msg" style="color:#4ade80"></p>
</div>
<div class="features">
<div class="feat">📹<br>Video Calls</div>
<div class="feat">🎙️<br>Voice Chat</div>
<div class="feat">👥<br>Groups</div>
</div>
<p style="color:#888;margin-top:30px">© 2026 ZEPPLO. All rights reserved.</p>
<script>
function notify(){
  var email = document.getElementById('email').value;
  if(!email || !email.includes('@')){ alert('Please enter valid email'); return; }
  var msg = "Hi ZEPPLO! I want to join. My email is: " + email;
  window.open("https://wa.me/923000000000?text=" + encodeURIComponent(msg), "_blank");
  document.getElementById('msg').innerText = "Thanks! We will notify you soon ✅";
}
function shareSite(){
  var text = "Check out ZEPPLO - The Future of Chatting! Coming Soon: https://zappofficial40-web.github.io/zepplo/";
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank");
}
function copyLink(){
  navigator.clipboard.writeText("https://zappofficial40-web.github.io/zepplo/");
  alert("Link Copied! Ab kisi ko bhej do.");
}
</script>
</body>
</html>
