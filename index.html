<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEPPLO</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="logo.png">
<meta name="theme-color" content="#00C853">
<style>
body{font-family:Arial;margin:0;background:#000;color:#fff}
.header{background:#00C853;color:#000;padding:12px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}
.header img{width:40px;height:40px;border-radius:10px}
.header b{font-size:24px;letter-spacing:1px}
.box{background:#111;margin:15px;padding:20px;border-radius:15px;text-align:center;border:1px solid #222}
.logo-big{width:110px;height:110px;border-radius:25px}
button{background:#00C853;color:#000;border:none;padding:13px 28px;border-radius:25px;font-size:16px;font-weight:bold;cursor:pointer}
input{width:90%;padding:12px;margin:8px;background:#222;border:1px solid #333;color:white;border-radius:10px}
.status{background:#111;margin:15px;padding:15px;border-radius:15px}
</style>
</head>
<body>
<div class="header"><img src="logo.png"><b>ZEPPLO</b></div>

<div class="box">
<img src="logo.png" class="logo-big">
<h2>Welcome to ZEPPLO</h2>
<p id="installStatus">Checking Install...</p>
<button id="installBtn">INSTALL NOW</button>
<p style="font-size:12px;color:#888;">Works on Chrome, WhatsApp, Facebook - Any Browser</p>
</div>

<div class="box">
<h3>Login</h3>
<input placeholder="Enter Your Name">
<input placeholder="Enter Phone Number">
<br><button>LOGIN</button>
</div>

<div class="status">
<h3>Status</h3>
<p>Your friends status will show here.</p>
</div>

<script>
let deferredPrompt;
let installBtn = document.getElementById('installBtn');
let statusText = document.getElementById('installStatus');
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  statusText.innerText = "App Ready - Click INSTALL NOW";
});
installBtn.addEventListener('click', async ()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    let choice = await deferredPrompt.userChoice;
    if(choice.outcome === 'accepted'){ statusText.innerText = "Installed Successfully!"; }
    deferredPrompt = null;
  } else {
    alert("To Install: Tap 3 Dots (Top Right) > Add to Home Screen / Install App");
  }
});
window.addEventListener('appinstalled', ()=>{
  statusText.innerText = "App Installed!";
  installBtn.style.display = "none";
});
</script>
</body>
</html>
