<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZEPPLO - Chat App</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#075E54">
<style>
body{font-family:Arial;margin:0;background:#ECE5DD}
.header{background:#075E54;color:white;padding:15px;text-align:center;font-size:22px;font-weight:bold}
.box{background:white;margin:15px;padding:20px;border-radius:12px;text-align:center}
button{background:#25D366;color:white;border:none;padding:12px 25px;border-radius:25px;font-size:16px;cursor:pointer}
input{width:90%;padding:12px;margin:8px;border:1px solid #ddd;border-radius:8px}
.status{background:white;margin:15px;padding:15px;border-radius:12px}
.ad{background:#fff;border:1px solid #ddd;padding:15px;margin:10px 0;border-radius:10px;text-align:center}
</style>
</head>
<body>
<div class="header">ZEPPLO</div>

<div class="box">
<h2>Welcome to ZEPPLO</h2>
<p id="installStatus">Checking Install...</p>
<button id="installBtn">INSTALL NOW</button>
<p style="font-size:12px;color:gray;">Works on Chrome, WhatsApp, Facebook - Any Browser</p>
</div>

<div class="box">
<h3>Login</h3>
<input placeholder="Enter Your Name">
<input placeholder="Enter Phone Number">
<br><button>LOGIN</button>
</div>

<div class="status">
<h3>Status</h3>
<p>Your friends status will show here.</p>
<div id="adBox"></div>
<p id="adTimer" style="font-size:12px;color:gray;"></p>
</div>

<script>
let deferredPrompt;
let installBtn = document.getElementById('installBtn');
let statusText = document.getElementById('installStatus');
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js'); }
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  statusText.innerText = "App Ready - Click INSTALL NOW";
  installBtn.style.display = "inline-block";
});
installBtn.addEventListener('click', async ()=>{
  if(deferredPrompt){
    deferredPrompt.prompt();
    let choice = await deferredPrompt.userChoice;
    if(choice.outcome === 'accepted'){ statusText.innerText = "Installed Successfully!"; }
    deferredPrompt = null;
  } else {
    alert("To Install: Tap 3 Dots (Top Right) > Add to Home Screen / Install App");
  }
});
window.addEventListener('appinstalled', ()=>{
  statusText.innerText = "App Installed!";
  installBtn.style.display = "none";
});
let adsSeen = parseInt(localStorage.getItem('zepplo_ads_seen') || 0);
let lastDate = localStorage.getItem('zepplo_ads_date') || "";
let today = new Date().toDateString();
if(lastDate !== today){ adsSeen=0; localStorage.setItem('zepplo_ads_date',today); localStorage.setItem('zepplo_ads_seen',0); }
let adBox = document.getElementById('adBox');
if(adsSeen >= 4){ adBox.innerHTML = "<p>Today's 4 Ads Finished. New Ads Tomorrow.</p>"; }
else {
  for(let i=0;i<4-adsSeen;i++){
    adBox.innerHTML += `<div class="ad"><b>Sponsored Ad ${i+1}</b><br><button onclick="watchAd()">Watch Ad - Earn +5 Rs</button></div>`;
  }
  document.getElementById('adTimer').innerText = "Remaining Ads Today: " + (4-adsSeen) + " / 4 Ads in 24 Hours";
}
function watchAd(){
  let s = parseInt(localStorage.getItem('zepplo_ads_seen')||0)+1;
  localStorage.setItem('zepplo_ads_seen',s);
  alert("Ad Watched! +5 Rs Added to Wallet. Remaining: "+(4-s));
  location.reload();
}
</script>
</body>
</html>
